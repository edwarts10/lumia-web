<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago Curso Programación - Lumia</title>
  <link rel="stylesheet" href="inscripcion.css" />
</head>
<body style="background-image: url('fondo lumia 2-02.png'); background-size: cover; background-position: center;">
  <div class="pago-container">
    <!--  formulario -->
    <div class="formulario">
      <img src="logo limua color.png" alt="Logo Lumia" class="logo">
      <h2>Escribe tu nombre y correo electrónico</h2>
      <p class="texto-secundario">Tu pago quedará asociado a este correo. Al completar la compra te pediremos crear una cuenta o iniciar sesión.</p>
      <form id="formPago">
        <input type="text" id="nombre" placeholder="Nombre Completo" required>
        <input type="email" id="correo" placeholder="Correo electrónico" required>
        <button type="submit">Continuar</button>
      </form>
    </div>

    <!--  información curso -->
    <div class="resumen">
      <img src="logo limua color.png" alt="Logo Lumia" class="logo-resumen">
      <h3 id="resumen-curso">Pago del curso</h3>
      <div class="precio">
        <span>Total a pagar</span>
        <strong id="resumen-precio">$80.000 COP</strong>
      </div>
      <div class="cupon">
        <a href="#">¿Tienes un cupón?</a>
      </div>
    </div>
  </div>

  <script src="inscripcion.js"></script>
</body>
</html>
